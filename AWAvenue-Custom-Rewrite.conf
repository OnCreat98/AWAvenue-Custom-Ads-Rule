#Title: AWAvenue-Custom Rewrite (开屏/融合广告路径拦截)
#--------------------------------------
#Version: 5
#Update time: 2026-09-22 18:15:00 UTC+8
#--------------------------------------
#基于抓包分析：网易云音乐开屏广告由 App 内部融合在核心业务域名
#interface3.music.163.com 上，通过以下 4 个 API 下发/上报：
#  /xeapi/ad/loading/bidget   广告竞价
#  /xeapi/ad/get              广告获取
#  /xeapi/ad/config/get       广告配置
#  /eapi/ad/monitor/impress   广告曝光上报
#
#域名级拦截无法只杀广告不影响业务，因此用「复写」拦截特定 URL 路径，
#使其返回空/拒绝，App 逻辑上无法渲染开屏广告，歌单/播放/登录不受影响。
#
#主机严格限定 interface3.music.163.com，其余主机不受影响。
#--------------------------------------
# 远程复写订阅文件：不包含 rewrite_local 段头（那是主配置语法），
# 仅规则行 + # 注释，否则 Quantumult X 报 Invalid Line。
#--------------------------------------

# 拦截网易云音乐开屏广告 API（QX 正则，reject 拒绝请求）
# 结尾 (\?|$) 锚定：只匹配该路径本身（可带 query），避免 /ad/getXXX 被误伤
^https://interface3\.music\.163\.com/(xeapi|eapi)/ad/(loading/bidget|get|config/get|monitor/impress)(\?|$) url reject

#--------------------------------------
# 备用：若上面的 eapi 前缀在某些版本未命中，可注释掉下面这行单独补充
# ^https://interface3\.music\.163\.com/eapi/ad/monitor/impress url reject

# 拦截花生日记自营广告/运营活动接口（hsrj-api 为核心域名，仅拦广告路径）
^https://hsrj-api\.huashengjia100\.com/general-rest/advert/getContentV2(\?|$) url reject

#--------------------------------------
# 2026-09-22 新增：哔哩哔哩 / 红果短剧（字节·番茄系）广告接口
#
# 为什么按路径拦而不是拦域名：
#   这些广告接口与核心业务接口同域（app.bilibili.com、i.snssdk.com 等），
#   整域拦截会连正常的首页推荐、播放、登录一起打断，只能按路径精确拦。
#
# 动作语义（Quantumult X 官方 sample.conf）：
#   reject      = HTTP 404 + 空响应       → 用于二进制资源（广告安装包/视频素材）
#   reject-dict = HTTP 200 + "{}"         → 用于 JSON 接口，App 拿到空对象=无广告，
#                                          比 404 更平滑（不会触发异常兜底/重试）
#   reject-img  = HTTP 200 + 1px gif      → 用于广告图片素材
#
# 生效前提：QX 已开启 MitM 且证书被信任；app.bilibili.com 走 HTTP/2，
#          还需打开「MitM over HTTP/2」，否则对 B 站不生效且不报错。
#          需加入 MitM hostname 列表的主机清单见 README。
#--------------------------------------

# ===== 哔哩哔哩 =====
# 开屏广告：接口返回 {"code":0,...,"data":{…}}，拦成 {} 即「无开屏」
^https://app\.bilibili\.com/x/v2/splash/(list|show|brand/list|event/list2)(\?|$) url reject-dict
# 弹幕广告
^https://api\.bilibili\.com/x/v2/dm/ad(\?|$) url reject-dict
# 首页右上角活动入口
^https://app\.bilibili\.com/x/resource/top/activity(\?|$) url reject-dict
# 漫画开屏（TWIRP 接口，仅 POST，路由已实测存在）
^https://manga\.bilibili\.com/twirp/comic\.v[0-9]+\.comic/(flash|Flash|listFlash|ListFlash)(\?|$) url reject

# ===== 红果短剧 / 番茄小说（字节系，同一技术栈与同一广告体系）=====
# 融合广告 API：字节系多个业务 App 共用 snssdk 域，整域拦会误伤 → 只拦 /api/ad/
# 注意：若把 i.snssdk.com 加入 MitM 后导致抖音/头条网络异常，是证书固定(pinning)所致，
#      删掉这两行并不要对 snssdk 业务域开 MitM 即可。
^https://(i|i-lq|is|mcs|security-lq)\.snssdk\.com/api/ad(/|\?|$) url reject-dict
# 广告安装包分发（二进制，实测该路径存在：GET 返回 405 method not allowed）
^https://gurd\.snssdk\.com/src/server/v3/package(\?|$) url reject
# 广告素材图片 / 广告安装包（CDN 路径级，保留 CDN 上非广告资源）
^https://[^/]+\.(pglstatp-toutiao|pstatp)\.com/(obj|img)/(ad|ad-app-package)/ url reject-img
^https://[^/]+\.pstatp\.com/obj/ad-pattern/renderer(\?|$) url reject-img

#--------------------------------------
# 可选（默认关闭）：哔哩哔哩首页信息流广告
# feed/index 是首页本体，整条拒绝会白屏，必须用响应体脚本删除广告 item
# （按 card_type=="cm_v2" / 存在 ad_info 过滤）。脚本来自社区且未在本机验证，
# 想启用就取消下面一行的注释，并确认 MitM 主机包含 app.bilibili.com：
# ^https://app\.bilibili\.com/x/v2/feed/index(\?|$) url script-response-body https://raw.githubusercontent.com/free1x/rules/main/bilibili-json.js
#--------------------------------------
