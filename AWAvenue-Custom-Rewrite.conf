#Title: AWAvenue-Custom Rewrite (网易云开屏广告拦截)
#--------------------------------------
#Version: 2
#Update time: 2026-09-03 21:20:00 UTC+8
#--------------------------------------
#基于抓包分析：网易云音乐开屏广告由 App 内部融合在核心业务域名
#interface3.music.163.com 上，通过以下 4 个 API 下发/上报：
#  /xeapi/ad/loading/bidget   广告竞价
#  /xeapi/ad/get              广告获取
#  /xeapi/ad/config/get       广告配置
#  /eapi/ad/monitor/impress   广告曝光上报
#
#域名级拦截无法只杀广告不影响业务，因此用「复写」拦截特定 URL 路径，
#使其返回空/拒绝，App 逻辑上无法渲染开屏广告，歌单/播放/登录不受影响。
#
#主机严格限定 interface3.music.163.com，其余主机不受影响。
#--------------------------------------
# 远程复写订阅文件：不包含 [rewrite_local] 段头（那是主配置语法），
# 仅规则行 + # 注释，否则 Quantumult X 报 Invalid Line。
#--------------------------------------

# 拦截网易云音乐开屏广告 API（QX 正则，reject 拒绝请求）
^https://interface3\.music\.163\.com/(xeapi|eapi)/ad/(loading/bidget|get|config/get|monitor/impress) url reject

#--------------------------------------
# 备用：若上面的 eapi 前缀在某些版本未命中，可注释掉下面这行单独补充
# ^https://interface3\.music\.163\.com/eapi/ad/monitor/impress url reject